<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#3D5AFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>랜드마크</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>
<div class="app" id="app">

  <!-- 지도 -->
  <section class="screen" id="scrMap">
    <header class="top">
      <div class="brand"><div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><path d="M9.3 10l1.9 1.9 3.6-3.7"/></svg></div><h1>랜드마크</h1></div>
      <div class="progress" id="progress"></div>
    </header>
    <div class="map" id="map">
      <div id="gl" aria-label="랜드마크 지도"></div>
      <div class="overlay" id="ov"></div>
      <div class="near" id="near"></div>
      <button class="chip mapfilt" id="filterBtn" type="button" aria-pressed="false">필터</button>
      <div class="jump" role="group" aria-label="지도 시점">
        <button type="button" id="jNear" aria-pressed="true">내 주변</button>
        <button type="button" id="jCity" aria-pressed="false">시·도</button>
        <button type="button" id="jNat" aria-pressed="false">전국</button>
      </div>
      <div class="gpsmsg" id="gpsMsg" hidden></div>
      <div class="pickov" id="pickOv" hidden><div class="cross"></div><div class="pickbar"><span>지도를 움직여 명소 위치를 가운데에 맞추세요</span><div class="askrow"><button type="button" class="btn ghost" id="pickNo">취소</button><button type="button" class="btn primary" id="pickOk">이 위치로</button></div></div></div>
      <div class="tripbar filt" id="filterBar" hidden><span id="filterBarName"></span><button type="button" id="filterOff">필터 끄기</button></div>
      <div class="tripbar" id="tripBar" hidden><span id="tripBarName"></span><button type="button" id="tripBarOff">전체 보기</button></div>
      <button class="rank" id="rankBtn" type="button" aria-label="지역 순위"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg><span>순위</span></button>
      <button class="gps" id="gpsBtn" type="button" aria-label="내 위치"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8.5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
      <section class="sheet" id="sheet" aria-hidden="true">
        <div class="grab"></div>
        <button class="x" id="closeSheet" type="button" aria-label="닫기">×</button>
        <button class="cover" id="cover" type="button" aria-label="사진 크게 보기"></button>
        <div class="body">
          <h2 id="sName"></h2>
          <div class="meta"><span id="sRegion"></span><span id="sSets"></span><span id="sDist"></span></div>
          <p class="desc" id="sDesc"></p>
          <div class="visit" id="sVisit"></div>
          <div class="sealrow">
            <button class="sealbtn" id="stampBtn" type="button" aria-label="도장 찍기"><span class="ring"><b>도장<br>꾹!</b></span></button>
            <div class="go" id="sGo" hidden></div>
            <p class="why" id="sWhy"></p>
          </div>
          <div class="act3"><a class="btn" id="routeBtn" href="#" target="_blank" rel="noopener">길찾기</a><button class="btn" id="photoBtn" type="button">사진 남기기</button><button class="btn" id="addTripBtn" type="button">내 여행에 담기</button></div>
        </div>
      </section>
    </div>
  </section>

  <!-- 도감 -->
  <section class="screen scroll pad" id="scrDogam" hidden>
    <div class="dg-top">
      <div class="seg" role="tablist"><button type="button" id="dgMine" role="tab" aria-selected="true">다녀온 곳</button><button type="button" id="dgTrips" role="tab" aria-selected="false">내 여행</button><button type="button" id="dgAll" role="tab" aria-selected="false">모든 곳</button></div>
      <div class="dg-sum" id="dgSum"></div>
    </div>
    <div class="dg-search"><input type="search" id="dgQ" placeholder="이름·지역으로 찾기" autocomplete="off"><button type="button" id="dgFilterBtn" class="chip" aria-pressed="false">필터</button><button type="button" id="dgTripBtn" class="chip">내 여행 만들기</button></div>
    <div class="dg-filters" id="dgFilters" hidden></div>
    <div class="dg-bar"><div class="dg-sort" id="dgSort"></div><div class="dg-group" id="dgGroup"></div></div>
    <div id="dgBody"></div>
    <details class="prog" id="dgProg"><summary>진행도 <span id="dgProgSum"></span></summary><div id="dgProgBody"></div></details>
    <div class="dg-selbar" id="dgSelBar" hidden><span id="dgSelCount">0곳 선택</span><input type="text" id="dgTripName" placeholder="이름 (예: 2026 가을 경주)" maxlength="24"><button type="button" class="btn primary" id="dgTripSave">저장</button><button type="button" class="btn ghost" id="dgTripCancel">취소</button></div>
  </section>

  <!-- 가이드 -->
  <section class="screen scroll pad" id="scrGuide" hidden>
    <div class="dg-top">
      <div class="seg" role="tablist"><button type="button" data-gt="all" role="tab" aria-selected="true">전체</button><button type="button" data-gt="region" role="tab" aria-selected="false">지역</button><button type="button" data-gt="mine" role="tab" aria-selected="false">내 관심</button></div>
      <div class="dg-sum" id="gdSum"></div>
    </div>
    <div class="dg-search"><input type="search" id="gdQ" placeholder="제목·지역으로 찾기" autocomplete="off"><button type="button" id="gdFilterBtn" class="chip" aria-pressed="false">필터</button><button type="button" id="gdUpBtn" class="chip up">+ 올리기</button></div>
    <div class="dg-filters" id="gdFilters" hidden></div>
    <div class="dg-bar"><div id="gdCrumb"></div><div class="dg-sort"><select id="gdSort" aria-label="정렬"><option value="likes">추천순</option><option value="near">주변순</option><option value="done">완주 많은 순</option><option value="new">최신순</option></select></div></div>
    <div id="gdBody"></div>
  </section>

  <!-- 내 정보 -->
  <section class="screen scroll pad" id="scrMe" hidden>
    <div class="me-card" id="meCard"></div>
  </section>

  <!-- 상세 -->
  <section class="detail" id="detail" aria-hidden="true"></section>

  <nav class="tabs" aria-label="메뉴">
    <button type="button" data-tab="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>지도</button>
    <button type="button" data-tab="dogam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="11" r="3.5"/><path d="M8 17h8"/></svg>랜드마크</button>
    <button type="button" data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5l6 2 4-2 6 2v14l-6-2-4 2z"/><path d="M10 7v12M14 5v12"/><circle cx="17" cy="9" r="1.2" fill="currentColor"/></svg>가이드</button>
    <button type="button" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>내 정보</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/media.js"></script>
<script src="js/regions.js"></script>
<script src="js/store.js"></script>
<script src="js/stamp.js"></script>
<script src="js/photo.js"></script>
<script src="js/guide.js"></script>
<script src="js/badges.js"></script>
<script src="js/share.js"></script>
<script src="js/trip.js"></script>
<script src="vendor/exifr.lite.js"></script>
<script src="js/memory.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
