name: Android Release (AAB)
# 스토어에 올릴 파일(서명 전)을 만든다. release 브랜치에 올리거나 직접 눌러야 돈다.
# 서명 키는 저장소에 두지 않는다. 여기서 나온 파일을 받아 따로 서명해서 올린다.
on:
  push:
    branches: [release]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Web build + Capacitor sync
        run: |
          npm ci
          npm run build:app
          npx cap sync android
      - name: Version
        run: |
          echo "VERSION_NAME=$(grep -oP "version: '\K[0-9.]+" js/config.js)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Build AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: landmark-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
