name: Android APK
on:
  push:
    branches: [app]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Web build + Capacitor sync
        run: |
          npm ci
          npm run build:app
          npx cap sync android
      - name: Version
        run: |
          echo "VERSION_NAME=$(grep -oP "version: '\K[0-9.]+" js/config.js)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/landmark.apk"
      - name: Publish test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: "시험판 v${{ env.VERSION_NAME }} (빌드 ${{ github.run_number }})"
          body: "폰에서 landmark.apk 를 받아 설치하세요. 시험용 서명이라 스토어 판과는 따로 설치됩니다."
          prerelease: true
          make_latest: false
          files: landmark.apk
