name: KTO 검색어로 다시 찾기
# 이름이 달라 못 찾은 명소를 tools/kto_kw.json 의 검색어로 다시 찾아 kto-kw-data 브랜치에 적는다. kto-kw 브랜치에 올리면 한 번 돈다.
on:
  push:
    branches: [kto-kw]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        env:
          KTO_KEY: ${{ secrets.KTO_KEY }}
        run: node tools/kto_kw.mjs
      - name: Save result
        run: |
          mkdir /tmp/o && cp tools/out/kw.json /tmp/o/
          cd /tmp/o && git init -q -b kto-kw-data && git add kw.json
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "검색어 후보"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kto-kw-data
