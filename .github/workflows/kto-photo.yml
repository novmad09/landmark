name: KTO 사진갤러리 후보 받기
# 한국관광공사 관광사진갤러리에서 사진 후보를 찾아 kto-photo-data 브랜치에 적는다. kto-photo 브랜치에 올리면 한 번 돈다.
on:
  push:
    branches: [kto-photo]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        env:
          KTO_KEY: ${{ secrets.KTO_KEY }}
        run: node tools/kto_photo.mjs
      - name: Save result
        run: |
          mkdir /tmp/o && cp tools/out/photo.json /tmp/o/
          cd /tmp/o && git init -q -b kto-photo-data && git add photo.json
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "관광사진갤러리 후보"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kto-photo-data
